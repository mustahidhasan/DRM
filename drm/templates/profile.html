{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Profile Card -->
            <div class="card shadow-lg rounded-4">
                <div class="card-header bg-primary text-white d-flex justify-content-center align-items-center">
                    <h4 class="mb-0"><i class="bi bi-person-circle me-2"></i> Customer Profile</h4>
                </div>
                <div class="card-body">

                    <div class="text-center mb-4">
                        <!-- Profile Picture -->
                        {% if user_data.profile_picture %}
                            <img src="{{ user_data.profile_picture.url }}" alt="Profile Picture" class="img-thumbnail rounded-circle" style="width: 150px; height: 150px; object-fit: cover;">
                        {% else %}
                            <img src="{% static 'images/default-avatar.png' %}" alt="Default Profile" class="img-thumbnail rounded-circle" style="width: 150px; height: 150px; object-fit: cover;">
                        {% endif %}
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Email (Read-only) -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-envelope-fill me-1"></i>Email</label>
                            <input type="email" class="form-control" value="{{ user_data.email }}" readonly>
                        </div>

                        <!-- Username (Read-only) -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person-fill me-1"></i>Username</label>
                            <input type="text" class="form-control" value="{{ user_data.username }}" readonly>
                        </div>

                        <!-- First Name -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person-circle me-1"></i>First Name</label>
                            {{ form.first_name }}
                        </div>

                        <!-- Last Name -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person-circle me-1"></i>Last Name</label>
                            {{ form.last_name }}
                        </div>

                        <!-- Profile Picture Upload -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-camera me-1"></i>Profile Picture</label>
                            {{ form.profile_picture }}
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg"><i class="bi bi-check-circle me-1"></i> Update Profile</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>
    /* profile.css */
body {
    background-color: #f8f9fa;
    font-family: 'Arial', sans-serif;
}

.card {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
}

.card-header {
    background-color: #007bff;
    color: #fff;
    font-size: 1.25rem;
    padding: 20px 25px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
}

.card-body {
    padding: 30px;
}

.form-label {
    font-size: 1rem;
    font-weight: 500;
}

.form-control {
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    padding: 10px 15px;
    box-shadow: none;
}

.form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
}

.form-control[readonly] {
    background-color: #f1f1f1;
    cursor: not-allowed;
}

.btn-success {
    background-color: #28a745;
    border-color: #28a745;
    border-radius: 8px;
    padding: 12px 25px;
    font-size: 1.1rem;
    font-weight: 600;
}

.btn-success:hover {
    background-color: #218838;
    border-color: #1e7e34;
}

.img-thumbnail {
    border-radius: 50%;
}

.text-center img {
    width: 150px;
    height: 150px;
    object-fit: cover;
}

.text-muted {
    font-size: 0.9rem;
    color: #6c757d;
}

.d-grid {
    margin-top: 25px;
}

@media (max-width: 768px) {
    .card-header {
        text-align: center;
    }

    .card-body {
        padding: 20px;
    }

    .form-control {
        font-size: 0.95rem;
    }

    .btn-success {
        width: 100%;
        padding: 14px;
    }
}

</style>
{% endblock %}
