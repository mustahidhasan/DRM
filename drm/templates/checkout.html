{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Checkout</h2>

    <div id="checkout-summary" class="mb-4">
        <h5>Your Items</h5>
        <ul class="list-group" id="checkout-items"></ul>
        <div class="text-end mt-3 fw-bold">Total: $<span id="checkout-total">0.00</span></div>
    </div>

    <div class="mt-5">
        <h5>Customer Details</h5>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Jane Doe" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="jane@example.com" required>
            </div>
            <button type="submit" class="btn btn-success">Confirm Order</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<script>
    function loadCheckoutCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const checkoutItems = document.getElementById('checkout-items');
        const checkoutTotal = document.getElementById('checkout-total');

        checkoutItems.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <div>
                    <strong>${item.name}</strong><br>
                    <small>$${item.price.toFixed(2)} x ${item.qty}</small>
                </div>
                <span class="badge bg-secondary">$${(item.price * item.qty).toFixed(2)}</span>
            `;
            checkoutItems.appendChild(li);
            total += item.price * item.qty;
        });

        checkoutTotal.textContent = total.toFixed(2);
    }

    document.addEventListener('DOMContentLoaded', loadCheckoutCart);
</script>
{% endblock %}
