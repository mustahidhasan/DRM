<div class="register-container">
    <form method="post" class="register-form">
      {% csrf_token %}
      <h2 class="form-title">Create Account</h2>
  
      <input type="text" name="first_name" placeholder="First Name" required class="form-control">
      <input type="text" name="last_name" placeholder="Last Name" required class="form-control">
      <input type="text" name="username" placeholder="Username" required class="form-control">
      <input type="email" name="email" placeholder="Email" required class="form-control">
      <input type="password" name="password" placeholder="Password" required class="form-control">
      <input type="password" name="confirm_password" placeholder="Confirm Password" required class="form-control">
  
      <button type="submit" class="btn-register">Register</button>
  
      <p class="redirect-text">
        Already have an account?
        <a href="{% url 'login' %}">Login Here</a>
      </p>
    </form>
  </div>
  
  <!-- CSS Styles -->
  <style>
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 95vh;
      background: linear-gradient(to right, #002147, #4fa7ff);
    }
  
    .register-form {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
  
    .form-title {
      margin-bottom: 25px;
      color: #002147;
      font-weight: bold;
      font-size: 24px;
    }
  
    .form-control {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
  
    .form-control:focus {
      outline: none;
      border-color: #4fa7ff;
      box-shadow: 0 0 5px rgba(79, 167, 255, 0.5);
    }
  
    .btn-register {
      width: 100%;
      padding: 12px;
      background-color: #002147;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 15px;
      transition: background-color 0.3s ease;
    }
  
    .btn-register:hover {
      background-color: #004080;
    }
  
    .redirect-text {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
    }
  
    .redirect-text a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
  
    .redirect-text a:hover {
      text-decoration: underline;
    }
  </style>
